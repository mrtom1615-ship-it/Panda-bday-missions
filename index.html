return `<section class="c"><h2>PANDA STAR CONTROL 🔐</h2><p class="m">Device-local owner gate only. A static website cannot prove identity or send entries from a separate phone to you. Anyone with access to this browser storage may inspect or alter it. Remote private reporting needs an authenticated backend.</p><p>Total stars: 51 · Collected: ${cnt()} · Remaining: ${N-cnt()}<br>Completed missions: ${Object.keys(S.done).length}<br>Naturally earned: ${nat} · Admin-granted: ${ad}<br>Birthday reveal: not part of this version</p>`
+(q?`<div role="alertdialog" aria-label="${q[0]}"><h3>${q[0]}</h3><p class="big" style="font-weight:400">${q[1]}</p><button data-a="ask" data-k="">CANCEL</button><button class="p" data-a="yes">${q[2]}</button></div>`:`<button class="p" data-a="ask" data-k="grant">GRANT ALL 51 STARS</button><button data-a="ask" data-k="reset">RESET TEST PROGRESS</button>`)
+`<label>Preview date (YYYY-MM-DD)<input id="dv" value="${dev||''}" placeholder="${today()}"></label><button data-a="dset">Set preview</button><button data-a="dclr">Clear preview</button><button data-a="exit">EXIT ADMIN MODE</button></section><section class="c"><h3>ALL 51 MISSIONS · PRE-SEND REVIEW</h3><p class="m">Review every reflection prompt, puzzle clue, and answer key before sharing. Open questions have no right answer; only the marked trivia/puzzle locks use fixed solutions.</p>${M.map((m,i)=>{const n=i+1,[title,type,cfg]=m;let details='';if(type==='bond')details=`<p>${esc(cfg.prompt)}</p><p>${cfg.mode==='quiz'?'Puzzle answer: '+esc(cfg.solution):'Open response · no fixed answer'}</p>`;else if(type==='text')details=cfg.map((x,j)=>`<p><b>Stage ${j+1}:</b> ${esc(x[0])}<br>Accepted: ${esc(x[1].join(' / '))}<br><small>Hint: ${esc(x[2])}</small></p>`).join('');else if(type==='pick')details=cfg.map(x=>`<p><b>${esc(x[0])}</b><br>${x[1].map(o=>{const key=o.split('|')[0],label=key.replace(/^~/,'');const keyed=x[1].some(y=>y.split('|')[0].startsWith('~'));return esc((keyed?(key.startsWith('~')?'✗ ':'✓ '):'• ')+label)}).join(' · ')}</p>`).join('');else if(type==='order')details=`<p>Correct sequence: <b>${esc(cfg[0].join(' → '))}</b><br>${esc(cfg[2])}</p>`;else if(type==='mem')details=`<p>Match pairs: ${esc(cfg.join(' · '))}</p>`;else if(type==='hunt')details=`<p>Find ${cfg[2]} of ${esc(cfg[1])} among ${esc(cfg[0])} · ${cfg[3]}×${cfg[3]} board</p>`;else if(type==='toggle')details=`<p>${esc(cfg[0][0])}<br>Options: ${esc(cfg[0][1].join(' · '))}<br>Minimum picks: ${cfg[1]}</p>`;else if(type==='flip')details=`<p>Reveal all notes: ${esc(cfg[1].join(' · '))}</p>`;else if(type==='hack')details=`<p>${esc(cfg[0])}<br>${esc(cfg[1].join(' → '))}<br>Final message: ${esc(cfg[2])}</p>`;else if(type==='maze')details=`<p>Maze map (# = wall): ${esc(cfg.join(' / '))}</p>`;else if(type==='seq')details=`<p>Repeat a ${cfg}-step color sequence.</p>`;else if(type==='pop')details=`<p>Pop ${cfg[1]} targets within ${cfg[2]} seconds.</p>`;else if(type==='bal')details=`<p>Hit the moving green zone ${cfg} times.</p>`;else if(type==='draw')details=`<p>Optional doodle canvas.</p>`;else if(type==='react')details=`<p>Reaction-timing mini-game.</p>`;return `<article class="m" style="padding:12px;border-bottom:1px solid var(--ch)"><b>${n}. ${esc(title)} · ${esc(type)}</b>${details}<p>State: ${S.done[n]?'Completed':'Not completed'} · Star: ${S.stars[n]?'Collected':'Uncollected'}</p></article>`}).join('')}<button data-a="exportQuestions">EXPORT QUESTION REVIEW</button></section><section class="c"><h3>Stars & missions</h3>${M.map((m,i)=>{const n=i+1;return `<div class="m">${n}. ${m[0]}: ${S.done[n]?'Completed naturally':'Not completed'} · ${S.stars[n]=='admin'?'star granted by admin':S.stars[n]?'star earned':'no star'}</div>`}).join('')}${S.log.length?`<h3>Audit (local)</h3>${S.log.map(l=>`<div class="m">${esc(l)}</div>`).join('')}`:''}</section><section class="c"><h3>MISSION ANSWER LEDGER</h3><p class="m">Entries stored in this browser: stage, answer, result, and reference solution. A static site cannot sync to another phone automatically; use export/import below for manual review.</p>${(S.responses||[]).slice().reverse().map(r=>`<article class="m" style="padding:10px;border-bottom:1px solid var(--ch)"><b>Mission ${r.mission} · Stage ${r.stage} · ${esc(r.at)}</b><p>${esc(r.prompt)}</p><p>Answer: <b>${esc(r.submitted||'(blank)')}</b></p><p>${r.accepted===true?'✅ Accepted':r.accepted===false?'❌ Not accepted':'💌 Open response / no right or wrong'} · Solution: <b>${esc(r.solution||'—')}</b></p></article>`).join('')||'<p>No answers recorded yet.</p>'}<button data-a="export">EXPORT ANSWER LEDGER</button><p class="m">If Arshiya plays on another phone, ask her to export her ledger there and send you the JSON file. Then import it here.</p><label>Import Arshiya’s ledger<input id="ledgerFile" type="file" accept=".json,application/json"></label><button data-a="import">IMPORT ANSWER LEDGER</button><p id="importStatus" role="status"></p></section>`};
const views={intro:vi,meet:vm,home:vh,gal:vg,mis:vx,owner:vo,admin:va};
function render(){if(P2.mount&&today()>=P2.date)return P2.mount(R,{S,save,M,star,go});if(V=='admin'&&!adm)V='owner';
R.innerHTML=views[V]()+(V=='intro'?'':'<footer style="text-align:center"><button class="ghost" data-a="owner" aria-label="Owner access">🔒</button></footer>');
if(V=='mis'){const m=M[NN-1];G[m[1]]($('#game'),m[2],g=>finish(NN,g),m[5])}}
const go=(v,n)=>{cl();cl=()=>{};V=v;NN=n||0;ask='';render();scrollTo(0,0)};
/* ===== actions ===== */
const A={home:()=>go('home'),gal:()=>go('gal'),owner:()=>go(adm?'admin':'owner'),meet:()=>{mi=0;go('meet')},start:()=>{S.intro=1;save();go('home')},nx:()=>{++mi<L.length?render():A.start()},
play:d=>{const n=+d.n;if(ok(n)&&n<=avail())go('mis',n)},
sd:d=>{const n=+d.n,m=M[n-1];$('#sd').innerHTML=S.stars[n]?`<b>${m[3]}</b><br>“${m[4]}”<br><small>Mission ${n} · ${S.stars[n]=='admin'?'granted by owner':'earned by playing'}</small>`:`Star ${n} comes with Mission ${n} (opens ${fmt(rel(n))}).`},
ask:d=>{ask=d.k;render()},
yes:()=>{const t=new Date().toISOString();if(ask=='grant'){for(let n=1;n<=N;n++)if(!S.stars[n])S.stars[n]='admin';S.log.push(t+' granted all stars')}else if(ask=='reset'){S.done={};S.stars={};S.title='';S.wish='';S.log.push(t+' reset test progress')}S.log=S.log.slice(-30);save();ask='';render()},
dset:()=>{const v=$('#dv').value.trim();if(/^\d{4}-\d\d-\d\d$/.test(v)){dev=v;wr(DK,v);render()}},dclr:()=>{dev=null;wr(DK,null);render()},exportQuestions:()=>{const blob=new Blob([JSON.stringify(M.map((m,i)=>({mission:i+1,title:m[0],type:m[1],config:m[2],starName:m[3],caption:m[4]})),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='panda-stars-question-review.json';a.click();URL.revokeObjectURL(url)},export:()=>{const blob=new Blob([JSON.stringify({schemaVersion:1,project:'Operation Panda Stars',exportedAt:new Date().toISOString(),entries:S.responses||[]},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='panda-stars-answer-ledger.json';a.click();URL.revokeObjectURL(url)},import:async()=>{const input=$('#ledgerFile'),f=input&&input.files&&input.files[0],status=$('#importStatus');if(!f){if(status)status.textContent='Choose an answer-ledger JSON file first.';return}try{const parsed=JSON.parse(await f.text()),items=Array.isArray(parsed)?parsed:parsed.entries;if(!Array.isArray(items))throw new Error('This file does not contain an answer ledger.');const clean=items.slice(-1500).filter(r=>r&&Number.isInteger(+r.mission)&&+r.mission>=1&&+r.mission<=N&&typeof r.prompt==='string'&&typeof r.submitted==='string').map(r=>({at:String(r.at||'Imported').slice(0,80),mission:+r.mission,stage:Math.max(1,Math.min(99,+r.stage||1)),prompt:r.prompt.slice(0,600),submitted:r.submitted.slice(0,6000),accepted:typeof r.accepted==='boolean'?r.accepted:null,solution:String(r.solution||'').slice(0,600)}));const key=r=>[r.at,r.mission,r.stage,r.prompt,r.submitted].join('|');const seen=new Set((S.responses||[]).map(key));let added=0;for(const r of clean){if(!seen.has(key(r))){S.responses.push(r);seen.add(key(r));added++}}S.responses=S.responses.slice(-1500);S.log.push(new Date().toISOString()+' imported '+added+' answer entries');S.log=S.log.slice(-30);save();render();const st=$('#importStatus');if(st)st.textContent='Imported '+added+' new entries. Existing duplicates were skipped.'}catch(e){if(status)status.textContent='Import failed: '+e.message}},exit:()=>{adm=0;go('home')},
login:async()=>{const f=$('#f'),p=$('#pw').value;if(Date.now()<lock){f.textContent='Too many tries. Wait a moment.';return}if(p.length<4){f.textContent='Use at least 4 characters.';return}
let c=null;try{c=JSON.parse(rd(AK))}catch(e){}const hs=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
try{if(!c){const s=[...crypto.getRandomValues(new Uint8Array(8))].join('');wr(AK,JSON.stringify({s,h:await hs(s)}));adm=1}else if(await hs(c.s)==c.h)adm=1}catch(e){f.textContent='This needs a secure (https) browser.';return}
if(adm){fails=0;go('admin')}else{if(++fails>=5){lock=Date.now()+3e4;fails=0}f.textContent='Invalid passcode.'}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
$('#fx').innerHTML=['✨','⭐','🎋','☁️','🌸','🐼'].map((e,i)=>`<span style="left:${8+i*16}%;animation-delay:${-i*3}s">${e}</span>`).join('');
render();
</script></body></html>
